version: 2
updates:
  # Node.js Bot Ecosystem (Mineflayer & Autonomous Agents)
  - package-ecosystem: "npm"
    directory: "/bots"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "mineflayer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mineflayer-auto-eat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vec3"
        update-types: ["version-update:semver-major"]
    groups:
      bot-dependencies:
        patterns:
          - "*"

  # Go Control Plane (mcctl Lifecycle & Admission Gates)
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      go-dependencies:
        patterns:
          - "*"

  # Rust Native Kinematics Core (mc_path_core 3D A* Engine)
  - package-ecosystem: "cargo"
    directory: "/bots/mc_path_core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  # GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions-dependencies:
        patterns:
          - "*"
