name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bots:
    name: Verify Autonomous JoJo Stand Bots & 500-Agent Society
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: bots/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build & Test Native Rust 3D Voxel Engine (mc_path_core)
        working-directory: bots/mc_path_core
        run: |
          cargo test --release
          cargo build --release

      - name: Install Bot Dependencies
        working-directory: bots
        run: |
          npm ci --prefer-offline --no-audit

      - name: Lint & Syntax Check
        working-directory: bots
        run: |
          for f in $(find src tests -name '*.mjs'); do
            node --check "$f" || exit 1
          done

      - name: Run Full Bot Test Suite (16 Node Suites + Rust Socket Daemon + SQLite $DIA Ledger)
        working-directory: bots
        env:
          OFFLINE_ONLY: '1'
          CI: 'true'
        run: |
          npm test

      - name: Run CLI & Orchestration Shell Harness
        working-directory: bots
        env:
          OFFLINE_ONLY: '1'
          CI: 'true'
        run: |
          bash tests/test_mc_bot.sh

  verify-go-systems:
    name: Verify Go Control Plane & Telemetry Systems
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go Race-Enabled Test Suite
        run: |
          go test -race ./...

  verify-server-configs:
    name: Validate Minecraft Server Configs & Tools
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate TOML / YAML Server Configs
        run: |
          pip install --no-cache-dir pyyaml
          python3 -c "
          import tomllib, yaml, glob, sys
          print('[*] Checking YAML & TOML files...')
          for y in glob.glob('config/**/*.yml', recursive=True) + glob.glob('config/**/*.yaml', recursive=True) + glob.glob('*.yml') + glob.glob('*.yaml'):
              with open(y, 'r') as f:
                  yaml.safe_load(f)
          print('[+] All server configurations parsed cleanly.')
          "
